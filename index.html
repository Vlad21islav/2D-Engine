<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Editor</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/menu.css">
    <link rel="stylesheet" href="styles/context-menu.css">
    <link rel="stylesheet" href="styles/settings-window.css">
    <link rel="stylesheet" href="styles/coords.css">
</head>
<body>
    <script src="js/script.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/settings-window.js"></script>
    <script src="js/context-menu.js"></script>
    <script src="js/canvas.js" defer></script>
    <script src="js/canvas-add-shapes.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <canvas></canvas>

    <div class="app-container">
        <!-- Верхняя панель с кнопкой Play -->
        <button class="btn-play">play</button>
        
        <!-- Правое меню -->
        <div id="menu-panel">
            <div class="menu-header" onclick="collapse('#menu-panel')">Menu</div>
            <div class="collapsible">
                <hr class="divider">
                <button class="btn-menu with-dropdown" onmouseenter="showDropdown(this, [['Rectangle', 'addRect()']])" onmouseleave="scheduleHideDropdown()">Add shape</button>
                <button class="btn-menu">Background</button>
                <button class="btn-menu" onclick="openSettings()">Settings</button>
                <button class="btn-menu">Download</button>
            </div>
        </div>

        <!-- Левая панель свойств -->
        <div id="context-menu">
            <div class="prop-header">Properties</div>
            <hr class="divider">
            <button class="btn-prop with-dropdown" onmouseenter="showDropdown(this, [['To object', NaN], ['On button', NaN]])" onmouseleave="scheduleHideDropdown()">Add force</button>
            <button class="btn-prop">Style</button>
            <button class="btn-prop">Colliding</button>
        </div>

        <!-- Выпадающий список (визуально) -->
        <div id="dropdown-panel" 
            onmouseenter="cancelHideDropdown()"
            onmouseleave="scheduleHideDropdown()">
        </div>

        <div id="cursor-coords" class="coords">
            <span class="coords__label">x:</span>
            <span class="coords__value" id="coord-x">0</span>
            <span class="coords__sep">|</span>
            <span class="coords__label">y:</span>
            <span class="coords__value" id="coord-y">0</span>
        </div>
    </div>
    
    <!-- Оверлей + модальное окно -->
    <div class="modal-overlay" id="settings-modal" onclick="closeSettingsOnOverlay(event)">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            
            <!-- Заголовок -->
            <div class="modal-header">
                <h2 id="settings-title">Settings</h2>
                <button class="modal-close" onclick="closeSettings()" aria-label="Close">✕</button>
            </div>

            <hr class="divider">

            <!-- Содержимое -->
            <div class="modal-body">
                
                <!-- Секция: Тема -->
                <div class="settings-group">
                    <label class="settings-label">Theme</label>
                    <div class="settings-options">
                        <button class="btn-option" onclick="on_change_theme_button('System')">System</button>
                        <button class="btn-option" onclick="on_change_theme_button('Dark')">Dark</button>
                        <button class="btn-option" onclick="on_change_theme_button('Light')">Light</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
